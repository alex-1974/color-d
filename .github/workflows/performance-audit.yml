      - name: Run focused release probe
        run: ./oklab-extreme-fallback-probe


  xyz-linear-rgb-production:
    name: Audit / XYZ LinearRGB production
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0

      - name: Environment
        shell: bash
        run: |
          "$DC" --version
          lscpu
          uname -a

      - name: Build focused release probe
        shell: bash
        run: |
          "$DC" \
              -O3 \
