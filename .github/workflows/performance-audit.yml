      - name: Run focused release probe
        run: ./gamut-inline-probe


  oklab-extreme-fallback:
    name: Audit / Oklab extreme fallback
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0

      - name: Environment
        shell: bash
        run: |
          "$DC" --version
          lscpu
