name: Publish documentation to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build development DDox site
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install D toolchain
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-2.113.0

      - name: Toolchain versions
        run: |
          "$DC" --version
          dub --version

      - name: Build DDox documentation
        run: dub build --compiler="$DC" --build=ddox --force

      - name: Assemble Pages site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-docs
          mkdir -p release-docs

          bash .github/scripts/assemble-pages-site.sh \
              docs \
              release-docs \
              pages-site \
              .github/pages/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
