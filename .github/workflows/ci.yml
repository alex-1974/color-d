name: Fast CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.113.0
          - ldc-1.43.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install D toolchain
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Toolchain versions
        run: |
          "$DC" --version
          dub --version

      - name: Debug unittests
        run: dub test --compiler="$DC" --build=debug --force

      - name: Release unittests
        run: dub test --compiler="$DC" --build=release --force

      - name: Extreme finite interpolation runtime probe
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat > "$tmp/probe.d" <<'D'
          import color;
          import std.conv : to;
          import std.stdio : writeln;

          int main(string[] args)
          {
              if (args.length != 3)
                  return 2;

              const double scaleD =
                  args[1].to!double;

              const double largeD =
                  scaleD * double.max;

              const resultD =
                  interpolate(
                      LinearSRgbd(
                          largeD,
                          -largeD,
                          largeD
                      ),
                      LinearSRgbd(
                          -largeD,
                          largeD,
                          -largeD
                      ),
                      0.5
                  );

              const float scaleF =
                  args[2].to!float;

              const float largeF =
                  scaleF * float.max;

              const resultF =
                  interpolate(
                      Oklabf(
                          largeF,
                          -largeF,
                          largeF
                      ),
                      Oklabf(
                          -largeF,
                          largeF,
                          -largeF
                      ),
                      0.5f
                  );

              writeln(
                  "double midpoint: ",
                  resultD.r,
                  " ",
                  resultD.g,
                  " ",
                  resultD.b
              );

              writeln(
                  "float midpoint: ",
                  resultF.l,
                  " ",
                  resultF.a,
                  " ",
                  resultF.b
              );

              if (
                  resultD.r != 0.0 ||
                  resultD.g != 0.0 ||
                  resultD.b != 0.0
              )
              {
                  return 1;
              }

              if (
                  resultF.l != 0.0f ||
                  resultF.a != 0.0f ||
                  resultF.b != 0.0f
              )
              {
                  return 1;
              }

              return 0;
          }
          D

          "$DC"               -I"$GITHUB_WORKSPACE/source"               -i               -of="$tmp/probe"               "$tmp/probe.d"

          "$tmp/probe" 0.75 0.75

      - name: TC-0005 current cbrt capability probe
        shell: bash
        run: |
          set -u

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat > "$tmp/attributes.d" <<'D'
          import std.math : cbrt;

          @safe pure nothrow @nogc
          double strictCbrt(double value)
          {
              return cbrt(value);
          }

          void main()
          {
          }
          D

          if "$DC" -of="$tmp/attributes" "$tmp/attributes.d" >"$tmp/attributes.log" 2>&1
          then
              echo "strict attributes: PASS"
          else
              echo "strict attributes: FAIL"
              cat "$tmp/attributes.log"
          fi

          cat > "$tmp/ctfe.d" <<'D'
          import std.math : cbrt;

          enum positive = cbrt(8.0);
          enum negative = cbrt(-8.0);

          static assert(positive == 2.0);
          static assert(negative == -2.0);

          void main()
          {
          }
          D

          if "$DC" -of="$tmp/ctfe" "$tmp/ctfe.d" >"$tmp/ctfe.log" 2>&1
          then
              echo "ctfe: PASS"
          else
              echo "ctfe: FAIL"
              cat "$tmp/ctfe.log"
          fi

          cat > "$tmp/runtime.d" <<'D'
          import std.math : cbrt, isNaN;
          import std.stdio : writeln;

          void main()
          {
              const positiveZero = cbrt(0.0);
              const negativeZero = cbrt(-0.0);
              const positiveInfinity = cbrt(double.infinity);
              const negativeInfinity = cbrt(-double.infinity);
              const nanValue = cbrt(double.nan);

              writeln(
                  "signed-zero reciprocals: ",
                  1.0 / positiveZero,
                  " ",
                  1.0 / negativeZero
              );

              writeln(
                  "infinities: ",
                  positiveInfinity,
                  " ",
                  negativeInfinity
              );

              writeln(
                  "nan: ",
                  isNaN(nanValue)
              );

              if (1.0 / positiveZero != double.infinity)
                  return;

              if (1.0 / negativeZero != -double.infinity)
                  return;

              if (positiveInfinity != double.infinity)
                  return;

              if (negativeInfinity != -double.infinity)
                  return;

              if (!isNaN(nanValue))
                  return;
          }
          D

          if "$DC" -of="$tmp/runtime" "$tmp/runtime.d" >"$tmp/runtime-build.log" 2>&1
          then
              echo "runtime build: PASS"
              "$tmp/runtime"
          else
              echo "runtime build: FAIL"
              cat "$tmp/runtime-build.log"
          fi

      - name: TC-0005 cube-root accuracy and cost probe
        shell: bash
        run: |
          set -u

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat > "$tmp/accuracy.d" <<'D'
          import std.math :
              cbrt,
              fabs,
              feqrel,
              isFinite,
              ldexp,
              pow;
          import std.stdio : writeln;

          T powCubeRoot(T)(T value)
          {
              if (value == cast(T)0)
                  return value;

              const T magnitude =
                  value < cast(T)0
                      ? -value
                      : value;

              const T root =
                  cast(T)pow(
                      magnitude,
                      cast(T)(1.0L / 3.0L)
                  );

              return
                  value < cast(T)0
                      ? -root
                      : root;
          }

          T runtimeCbrt(T)(T value)
          {
              return cbrt(value);
          }

          T highPrecisionReference(T)(T value)
          {
              return
                  cast(T)cbrt(
                      cast(real)value
                  );
          }

          struct Accuracy
          {
              size_t count;
              size_t powExact;
              size_t cbrtExact;
              int powMinEqualBits = int.max;
              int cbrtMinEqualBits = int.max;
              real powMaxRelative;
              real cbrtMaxRelative;
          }

          void observe(T)(
              ref Accuracy result,
              T value
          )
          {
              const T reference =
                  highPrecisionReference(value);

              const T powValue =
                  powCubeRoot(value);

              const T cbrtValue =
                  runtimeCbrt(value);

              ++result.count;

              if (powValue == reference)
                  ++result.powExact;

              if (cbrtValue == reference)
                  ++result.cbrtExact;

              const int powBits =
                  feqrel(
                      cast(real)powValue,
                      cast(real)reference
                  );

              const int cbrtBits =
                  feqrel(
                      cast(real)cbrtValue,
                      cast(real)reference
                  );

              if (powBits < result.powMinEqualBits)
                  result.powMinEqualBits = powBits;

              if (cbrtBits < result.cbrtMinEqualBits)
                  result.cbrtMinEqualBits = cbrtBits;

              if (reference != cast(T)0)
              {
                  const real refReal =
                      cast(real)reference;

                  const real powRelative =
                      fabs(
                          (
                              cast(real)powValue -
                              refReal
                          ) /
                          refReal
                      );

                  const real cbrtRelative =
                      fabs(
                          (
                              cast(real)cbrtValue -
                              refReal
                          ) /
                          refReal
                      );

                  if (powRelative > result.powMaxRelative)
                      result.powMaxRelative = powRelative;

                  if (cbrtRelative > result.cbrtMaxRelative)
                      result.cbrtMaxRelative = cbrtRelative;
              }
          }

          Accuracy characterize(T)(
              int minExponent,
              int maxExponent
          )
          {
              Accuracy result;

              immutable real[7] mantissas =
              [
                  0.5000001L,
                  0.625L,
                  0.75L,
                  1.0L,
                  1.25L,
                  1.5L,
                  1.999999L
              ];

              foreach (exponent; minExponent .. maxExponent + 1)
              {
                  foreach (mantissa; mantissas)
                  {
                      const T positive =
                          cast(T)ldexp(
                              cast(real)mantissa,
                              exponent
                          );

                      if (
                          !isFinite(positive) ||
                          positive == cast(T)0
                      )
                      {
                          continue;
                      }

                      observe(result, positive);
                      observe(result, -positive);
                  }
              }

              return result;
          }

          void printResult(
              string name,
              Accuracy value
          )
          {
              writeln(
                  name,
                  " samples=",
                  value.count,
                  " powExact=",
                  value.powExact,
                  " cbrtExact=",
                  value.cbrtExact,
                  " powMinEqualBits=",
                  value.powMinEqualBits,
                  " cbrtMinEqualBits=",
                  value.cbrtMinEqualBits,
                  " powMaxRelative=",
                  value.powMaxRelative,
                  " cbrtMaxRelative=",
                  value.cbrtMaxRelative
              );
          }

          void main()
          {
              printResult(
                  "float",
                  characterize!float(
                      -125,
                      125
                  )
              );

              printResult(
                  "double",
                  characterize!double(
                      -1020,
                      1020
                  )
              );
          }
          D

          if "$DC" -O -release -of="$tmp/accuracy" "$tmp/accuracy.d" >"$tmp/accuracy-build.log" 2>&1
          then
              echo "accuracy build: PASS"
              "$tmp/accuracy"
          else
              echo "accuracy build: FAIL"
              cat "$tmp/accuracy-build.log"
          fi

          cat > "$tmp/bench_pow.d" <<'D'
          import std.math : pow;
          import std.stdio : writeln;

          pragma(inline, false)
          double cubeRoot(double value)
          {
              if (value == 0.0)
                  return value;

              const double magnitude =
                  value < 0.0
                      ? -value
                      : value;

              const double root =
                  cast(double)pow(
                      magnitude,
                      cast(double)(1.0L / 3.0L)
                  );

              return value < 0.0 ? -root : root;
          }

          void main()
          {
              double sum;

              foreach (i; 0 .. 5_000_000)
              {
                  double value =
                      cast(double)((i % 20_000) + 1) /
                      10_000.0;

                  if (i & 1)
                      value = -value;

                  sum += cubeRoot(value);
              }

              writeln(sum);
          }
          D

          cat > "$tmp/bench_cbrt.d" <<'D'
          import std.math : cbrt;
          import std.stdio : writeln;

          pragma(inline, false)
          double cubeRoot(double value)
          {
              return cbrt(value);
          }

          void main()
          {
              double sum;

              foreach (i; 0 .. 5_000_000)
              {
                  double value =
                      cast(double)((i % 20_000) + 1) /
                      10_000.0;

                  if (i & 1)
                      value = -value;

                  sum += cubeRoot(value);
              }

              writeln(sum);
          }
          D

          if [[ "$DC" == *ldc2 ]]
          then
              opt=(-O3 -release)
          else
              opt=(-O -release -inline)
          fi

          "$DC" "${opt[@]}" -of="$tmp/bench_pow" "$tmp/bench_pow.d"
          "$DC" "${opt[@]}" -of="$tmp/bench_cbrt" "$tmp/bench_cbrt.d"

          for run in 1 2 3
          do
              /usr/bin/time -f "pow run=$run seconds=%e" "$tmp/bench_pow" >/dev/null
              /usr/bin/time -f "cbrt run=$run seconds=%e" "$tmp/bench_cbrt" >/dev/null
          done

      - name: External import compile smoke
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat > "$tmp/root.d" <<'D'
          import color;

          enum mapped =
              Oklchd(
                  0.70,
                  0.30,
                  OklabHued.fromDegrees(40.0)
              )
              .gamutMapRayTraceToLinearSRgb();

          static assert(mapped.inGamut);

          bool toneBatchCtfe()
          @safe pure nothrow @nogc
          {
              const seed =
                  Oklchd(
                      0.50,
                      0.10,
                      OklabHued.fromDegrees(210.0)
                  );

              const double[3] lightnesses =
                  [0.20, 0.50, 0.80];

              const double[3] chromas =
                  [0.04, 0.10, 0.06];

              Oklchd[3] tones;

              tonesAtLightnessAndChromaInto(
                  seed,
                  lightnesses,
                  chromas,
                  tones
              );

              return
                  tones[0].l == 0.20 &&
                  tones[1].c == 0.10 &&
                  tones[2].c == 0.06;
          }

          static assert(toneBatchCtfe());

          void main()
          {
              double[2] lightnesses =
                  [0.25, 0.75];

              double[2] chromas =
                  [0.05, 0.15];

              Oklchd[2] output;

              assert(
                  tryTonesAtLightnessAndChromaInto(
                      Oklchd(
                          0.50,
                          0.10,
                          OklabHued.fromDegrees(210.0)
                      ),
                      lightnesses[],
                      chromas[],
                      output[]
                  )
              );
          }
          D

          cat > "$tmp/direct.d" <<'D'
          import color.rgb;
          import color.xyz;
          import color.oklab;
          import color.oklch;
          import color.gamut;
          import color.alpha;
          import color.composite;
          import color.interpolate;
          import color.difference;
          import color.wcag;
          import color.tone;

          void main()
          {
          }
          D

          "$DC"               -c               -I"$GITHUB_WORKSPACE/source"               -i               -of="$tmp/root.o"               "$tmp/root.d"

          "$DC"               -c               -I"$GITHUB_WORKSPACE/source"               -i               -of="$tmp/direct.o"               "$tmp/direct.d"
