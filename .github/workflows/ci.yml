name: Fast CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.113.0
          - ldc-1.43.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install D toolchain
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Toolchain versions
        run: |
          "$DC" --version
          dub --version

      - name: Debug unittests
        run: dub test --compiler="$DC" --build=debug --force

      - name: Release unittests
        run: dub test --compiler="$DC" --build=release --force

      - name: External import compile smoke
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat > "$tmp/root.d" <<'D'
          import color;

          enum mapped =
              Oklchd(
                  0.70,
                  0.30,
                  OklabHued.fromDegrees(40.0)
              )
              .gamutMapRayTraceToLinearSRgb();

          static assert(mapped.inGamut);

          bool toneBatchCtfe()
          @safe pure nothrow @nogc
          {
              const seed =
                  Oklchd(
                      0.50,
                      0.10,
                      OklabHued.fromDegrees(210.0)
                  );

              const double[3] lightnesses =
                  [0.20, 0.50, 0.80];

              const double[3] chromas =
                  [0.04, 0.10, 0.06];

              Oklchd[3] tones;

              tonesAtLightnessAndChromaInto(
                  seed,
                  lightnesses,
                  chromas,
                  tones
              );

              return
                  tones[0].l == 0.20 &&
                  tones[1].c == 0.10 &&
                  tones[2].c == 0.06;
          }

          static assert(toneBatchCtfe());

          void main()
          {
              double[2] lightnesses =
                  [0.25, 0.75];

              double[2] chromas =
                  [0.05, 0.15];

              Oklchd[2] output;

              assert(
                  tryTonesAtLightnessAndChromaInto(
                      Oklchd(
                          0.50,
                          0.10,
                          OklabHued.fromDegrees(210.0)
                      ),
                      lightnesses[],
                      chromas[],
                      output[]
                  )
              );
          }
          D

          cat > "$tmp/direct.d" <<'D'
          import color.rgb;
          import color.xyz;
          import color.oklab;
          import color.oklch;
          import color.gamut;
          import color.alpha;
          import color.composite;
          import color.interpolate;
          import color.difference;
          import color.wcag;
          import color.tone;

          void main()
          {
          }
          D

          "$DC"               -c               -I"$GITHUB_WORKSPACE/source"               -i               -of="$tmp/root.o"               "$tmp/root.d"

          "$DC"               -c               -I"$GITHUB_WORKSPACE/source"               -i               -of="$tmp/direct.o"               "$tmp/direct.d"
