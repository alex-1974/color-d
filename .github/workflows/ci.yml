name: Fast CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.113.0
          - ldc-1.43.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install D toolchain
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Toolchain versions
        run: |
          "$DC" --version
          dub --version

      - name: Debug unittests
        run: dub test --compiler="$DC" --build=debug --force

      - name: Release unittests
        run: dub test --compiler="$DC" --build=release --force

      - name: Extreme finite interpolation runtime probe
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat > "$tmp/probe.d" <<'D'
          import color;
          import std.conv : to;
          import std.stdio : writeln;

          int main(string[] args)
          {
              if (args.length != 3)
                  return 2;

              const double scaleD =
                  args[1].to!double;

              const double largeD =
                  scaleD * double.max;

              const resultD =
                  interpolate(
                      LinearSRgbd(
                          largeD,
                          -largeD,
                          largeD
                      ),
                      LinearSRgbd(
                          -largeD,
                          largeD,
                          -largeD
                      ),
                      0.5
                  );

              const float scaleF =
                  args[2].to!float;

              const float largeF =
                  scaleF * float.max;

              const resultF =
                  interpolate(
                      Oklabf(
                          largeF,
                          -largeF,
                          largeF
                      ),
                      Oklabf(
                          -largeF,
                          largeF,
                          -largeF
                      ),
                      0.5f
                  );

              writeln(
                  "double midpoint: ",
                  resultD.r,
                  " ",
                  resultD.g,
                  " ",
                  resultD.b
              );

              writeln(
                  "float midpoint: ",
                  resultF.l,
                  " ",
                  resultF.a,
                  " ",
                  resultF.b
              );

              if (
                  resultD.r != 0.0 ||
                  resultD.g != 0.0 ||
                  resultD.b != 0.0
              )
              {
                  return 1;
              }

              if (
                  resultF.l != 0.0f ||
                  resultF.a != 0.0f ||
                  resultF.b != 0.0f
              )
              {
                  return 1;
              }

              return 0;
          }
          D

          "$DC"               -I"$GITHUB_WORKSPACE/source"               -i               -of="$tmp/probe"               "$tmp/probe.d"

          "$tmp/probe" 0.75 0.75

      - name: Oklab CTFE/runtime parity probe
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat > "$tmp/probe.d" <<'D'
          import color;
          import std.conv : to;
          import std.math : fabs;
          import std.stdio : writeln;

          enum ordinaryExpectedD =
              XyzD65d(
                  0.125,
                  0.25,
                  0.5
              )
              .toOklab;

          enum extendedExpectedD =
              XyzD65d(
                  -0.25,
                  0.5,
                  1.25
              )
              .toOklab;

          enum ordinaryExpectedF =
              XyzD65f(
                  0.125f,
                  0.25f,
                  0.5f
              )
              .toOklab;

          enum extendedExpectedF =
              XyzD65f(
                  -0.25f,
                  0.5f,
                  1.25f
              )
              .toOklab;

          bool close(T)(
              T actual,
              T expected,
              T tolerance
          )
          {
              return
                  fabs(
                      cast(real)actual -
                      cast(real)expected
                  ) <= cast(real)tolerance;
          }

          int main(string[] args)
          {
              if (args.length != 5)
                  return 2;

              const bool extended =
                  args[1] == "extended";

              const double xD = args[2].to!double;
              const double yD = args[3].to!double;
              const double zD = args[4].to!double;

              const actualD =
                  XyzD65d(xD, yD, zD).toOklab;

              const expectedD =
                  extended
                      ? extendedExpectedD
                      : ordinaryExpectedD;

              writeln(
                  "double diff: ",
                  fabs(actualD.l - expectedD.l),
                  " ",
                  fabs(actualD.a - expectedD.a),
                  " ",
                  fabs(actualD.b - expectedD.b)
              );

              if (
                  !close(actualD.l, expectedD.l, 5e-14) ||
                  !close(actualD.a, expectedD.a, 5e-14) ||
                  !close(actualD.b, expectedD.b, 5e-14)
              )
              {
                  return 1;
              }

              const float xF = args[2].to!float;
              const float yF = args[3].to!float;
              const float zF = args[4].to!float;

              const actualF =
                  XyzD65f(xF, yF, zF).toOklab;

              const expectedF =
                  extended
                      ? extendedExpectedF
                      : ordinaryExpectedF;

              writeln(
                  "float diff: ",
                  fabs(
                      cast(double)actualF.l -
                      cast(double)expectedF.l
                  ),
                  " ",
                  fabs(
                      cast(double)actualF.a -
                      cast(double)expectedF.a
                  ),
                  " ",
                  fabs(
                      cast(double)actualF.b -
                      cast(double)expectedF.b
                  )
              );

              if (
                  !close(actualF.l, expectedF.l, 3e-6f) ||
                  !close(actualF.a, expectedF.a, 3e-6f) ||
                  !close(actualF.b, expectedF.b, 3e-6f)
              )
              {
                  return 1;
              }

              return 0;
          }
          D

          "$DC"               -I"$GITHUB_WORKSPACE/source"               -i               -of="$tmp/probe"               "$tmp/probe.d"

          "$tmp/probe" ordinary 0.125 0.25 0.5
          "$tmp/probe" extended -0.25 0.5 1.25

      - name: Generated schedule release invalid-input probe
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat > "$tmp/probe.d" <<'D'
          import color;
          import std.conv : to;
          import std.stdio : write, writeln;

          double parseValue(string text)
          {
              if (text == "nan")
                  return double.nan;

              if (text == "inf")
                  return double.infinity;

              if (text == "-inf")
                  return -double.infinity;

              return text.to!double;
          }

          void main(string[] args)
          {
              if (args.length != 3)
                  return;

              const start =
                  parseValue(args[1]);

              const end =
                  parseValue(args[2]);

              const values =
                  linearSchedule!5(
                      start,
                      end
                  );

              write(
                  args[1],
                  " -> ",
                  args[2],
                  ":"
              );

              foreach (value; values)
              {
                  write(" ", value);
              }

              writeln();
          }
          D

          "$DC"               -release               -I"$GITHUB_WORKSPACE/source"               -i               -of="$tmp/probe"               "$tmp/probe.d"

          "$tmp/probe" nan 1
          "$tmp/probe" inf inf
          "$tmp/probe" inf -inf
          "$tmp/probe" -inf 1

      - name: External import compile smoke
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat > "$tmp/root.d" <<'D'
          import color;

          enum mapped =
              Oklchd(
                  0.70,
                  0.30,
                  OklabHued.fromDegrees(40.0)
              )
              .gamutMapRayTraceToLinearSRgb();

          static assert(mapped.inGamut);

          bool toneBatchCtfe()
          @safe pure nothrow @nogc
          {
              const seed =
                  Oklchd(
                      0.50,
                      0.10,
                      OklabHued.fromDegrees(210.0)
                  );

              const double[3] lightnesses =
                  [0.20, 0.50, 0.80];

              const double[3] chromas =
                  [0.04, 0.10, 0.06];

              Oklchd[3] tones;

              tonesAtLightnessAndChromaInto(
                  seed,
                  lightnesses,
                  chromas,
                  tones
              );

              return
                  tones[0].l == 0.20 &&
                  tones[1].c == 0.10 &&
                  tones[2].c == 0.06;
          }

          static assert(toneBatchCtfe());

          void main()
          {
              double[2] lightnesses =
                  [0.25, 0.75];

              double[2] chromas =
                  [0.05, 0.15];

              Oklchd[2] output;

              assert(
                  tryTonesAtLightnessAndChromaInto(
                      Oklchd(
                          0.50,
                          0.10,
                          OklabHued.fromDegrees(210.0)
                      ),
                      lightnesses[],
                      chromas[],
                      output[]
                  )
              );
          }
          D

          cat > "$tmp/direct.d" <<'D'
          import color.rgb;
          import color.xyz;
          import color.oklab;
          import color.oklch;
          import color.gamut;
          import color.alpha;
          import color.composite;
          import color.interpolate;
          import color.difference;
          import color.wcag;
          import color.tone;

          void main()
          {
          }
          D

          "$DC"               -c               -I"$GITHUB_WORKSPACE/source"               -i               -of="$tmp/root.o"               "$tmp/root.d"

          "$DC"               -c               -I"$GITHUB_WORKSPACE/source"               -i               -of="$tmp/direct.o"               "$tmp/direct.d"
